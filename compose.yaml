services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: album
      POSTGRES_PASSWORD: album
      POSTGRES_DB: memoryalbum
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U album -d memoryalbum"]
      interval: 5s
      retries: 10
volumes:
  postgres-data:
